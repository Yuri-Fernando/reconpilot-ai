spring:
  datasource:
    url: jdbc:h2:mem:reconpilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: PUBLIC
  flyway:
    enabled: false
  main:
    banner-mode: off
app:
  frontend-origin: http://localhost:4200
  analytics:
    enabled: false
    base-url: http://localhost:8000
    token: test-token
    timeout: 2s
