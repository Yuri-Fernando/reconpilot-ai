services:
  db:
    image: postgres:16-alpine
    container_name: reconpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reconpilot}
      POSTGRES_USER: ${POSTGRES_USER:-reconpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  ai-service:
    profiles: ["ai"]
    build: ./ai-service
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
volumes:
  postgres_data:
